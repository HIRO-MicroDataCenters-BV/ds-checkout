openapi: 3.1.0
info:
  title: Checkout service
  description: This is a checkout service for temporary storage of orders
  contact:
    name: HIRO-MicroDataCenters
    email: all-hiro@hiro-microdatacenters.nl
  license:
    name: MIT
    url: https://github.com/HIRO-MicroDataCenters-BV/template-python/blob/main/LICENSE
  version: 0.1.0
paths:
  /metrics:
    get:
      summary: Metrics
      description: Endpoint that serves Prometheus metrics.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health-check/:
    get:
      summary: Health check
      description: Returns a 200 status code if the service is up and running
      operationId: health_check
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
  /orders:
    post:
      tags:
      - Orders
      summary: Store checkout order
      description: "Store checkout order temporarily\n\n- Accepts JSON-LD format\n\
        - Generates UUID\n- Stores in Redis with TTL\n- Asks each region's contract\
        \ generator for a contract covering that\n  region's datasets (CONTRACT_GENERATORS);\
        \ best effort\n- Returns order_id and the contracts issued\n\nThe consumer\
        \ named in a contract comes from the ds-login JWT in\n`Authorization: Bearer\
        \ \u2026` (its email, else keri:<AID>), which the\nwebsite passes on. The\
        \ token is read, not verified, until tokens are\nchecked after the demo."
      operationId: store_order_orders_post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreOrderRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_id}:
    get:
      tags:
      - Orders
      summary: Retrieve checkout order
      description: 'Retrieve checkout order by UUID


        - Retrieves from Redis

        - Transforms JSON-LD to plain JSON

        - Returns order data'
      operationId: retrieve_order_orders__order_id__get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthCheck:
      properties:
        status:
          type: string
          title: Status
          default: OK
          examples:
          - OK
      type: object
      title: HealthCheck
    OrderContract:
      properties:
        region:
          type: string
          title: Region
          description: Region whose datasets it covers, e.g. hus
        jti:
          type: string
          title: Jti
          description: Contract id, as listed in the Clearing House
        token:
          type: string
          title: Token
          description: The signed contract (VC-JWT)
      type: object
      required:
      - region
      - jti
      - token
      title: OrderContract
      description: A contract issued for (part of) an order by one region's generator.
    RetrieveOrderResponse:
      properties:
        order_id:
          type: string
          title: Order Id
        data:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Data
          description: Array of dataset objects
        contracts:
          items:
            $ref: '#/components/schemas/OrderContract'
          type: array
          title: Contracts
          description: Contracts issued for this order, held as long as the order
            is.
      type: object
      required:
      - order_id
      - data
      title: RetrieveOrderResponse
      description: Response model for retrieve operation
    StoreOrderRequest:
      properties:
        data:
          additionalProperties: true
          type: object
          title: Data
          description: JSON-LD order data
      type: object
      required:
      - data
      title: StoreOrderRequest
      description: Request model for storing checkout order
    StoreOrderResponse:
      properties:
        order_id:
          type: string
          title: Order Id
          description: UUID of the stored order
        expires_in_seconds:
          type: integer
          title: Expires In Seconds
          description: TTL in seconds
        contracts:
          items:
            $ref: '#/components/schemas/OrderContract'
          type: array
          title: Contracts
          description: Contracts issued for this order, one per region with a contract
            generator. Empty when none could be issued; the order is stored either
            way.
      type: object
      required:
      - order_id
      - expires_in_seconds
      title: StoreOrderResponse
      description: Response model for store operation
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
