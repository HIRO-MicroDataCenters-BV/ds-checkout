openapi: 3.1.0
info:
  title: Checkout service
  description: This is a checkout service for temporary storage of orders
  contact:
    name: HIRO-MicroDataCenters
    email: all-hiro@hiro-microdatacenters.nl
  license:
    name: MIT
    url: https://github.com/HIRO-MicroDataCenters-BV/template-python/blob/main/LICENSE
  version: 0.1.0
paths:
  /metrics:
    get:
      summary: Metrics
      description: Endpoint that serves Prometheus metrics.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health-check/:
    get:
      summary: Health check
      description: Returns a 200 status code if the service is up and running
      operationId: health_check
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
  /orders:
    post:
      tags:
      - Orders
      summary: Store checkout order
      description: 'Store checkout order temporarily


        - Accepts JSON-LD format

        - Generates UUID

        - Stores in Redis with TTL

        - Returns order_id for retrieval'
      operationId: store_order_orders_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreOrderRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_id}:
    get:
      tags:
      - Orders
      summary: Retrieve checkout order
      description: 'Retrieve checkout order by UUID


        - Retrieves from Redis

        - Transforms JSON-LD to plain JSON

        - Returns order data'
      operationId: retrieve_order_orders__order_id__get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthCheck:
      properties:
        status:
          type: string
          title: Status
          default: OK
          examples:
          - OK
      type: object
      title: HealthCheck
    RetrieveOrderResponse:
      properties:
        order_id:
          type: string
          title: Order Id
        data:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Data
          description: Array of dataset objects
      type: object
      required:
      - order_id
      - data
      title: RetrieveOrderResponse
      description: Response model for retrieve operation
    StoreOrderRequest:
      properties:
        data:
          additionalProperties: true
          type: object
          title: Data
          description: JSON-LD order data
      type: object
      required:
      - data
      title: StoreOrderRequest
      description: Request model for storing checkout order
    StoreOrderResponse:
      properties:
        order_id:
          type: string
          title: Order Id
          description: UUID of the stored order
        expires_in_seconds:
          type: integer
          title: Expires In Seconds
          description: TTL in seconds
      type: object
      required:
      - order_id
      - expires_in_seconds
      title: StoreOrderResponse
      description: Response model for store operation
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
