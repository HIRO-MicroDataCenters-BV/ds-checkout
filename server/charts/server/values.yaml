# Chart values for ds-checkout
replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
  pullSecret: ""

# Optional: override the namespace; defaults to release namespace
namespace: marketplace

nameOverride: "ds-checkout"
fullnameOverride: "ds-checkout"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

container:
  command: ["uvicorn"]
  args: ["app.main:app", "--host", "0.0.0.0", "--port", "6000"]

livenessProbe:
  httpGet:
    path: /health-check
    port: http
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health-check
    port: http
    scheme: HTTP
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  failureThreshold: 3


service:
  type: ClusterIP
  port: 6000

env:
  - name : LOG_LEVEL
    value: "INFO"

  - name: ORDER_TTL_SECONDS
    value: "7200" # 120 minutes
  - name: ORDER_KEY_PREFIX
    value: "order:"  # Prefix for order keys in storage
  - name: ORDER_TTL_ENABLED
    value: "true"
  - name: MAX_PAYLOAD_SIZE_BYTES
    value: "10485760" # 10 MB

  - name: DATABASE__PROTOCOL
    value: "redis"
  - name: DATABASE__HOST
    value: "redis-repository"
  - name: DATABASE__PORT
    value: "6379"
  - name: DATABASE__DB_NUMBER
    value: "0"
  - name: DATABASE__USERNAME
    value: ""
  - name: DATABASE__PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis-credentials
        key: password

  - name: TEST_DATABASE__PROTOCOL
    value: "redis"
  - name: TEST_DATABASE__HOST
    value: "redis-repository"
  - name: TEST_DATABASE__PORT
    value: "6379"
  - name: TEST_DATABASE__DB_NUMBER
    value: "15"
  - name: TEST_DATABASE__USERNAME
    value: ""
  - name: TEST_DATABASE__PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis-credentials
        key: password

resources:
  requests:
    memory: "64Mi"
    cpu: "250m"
  limits:
    memory: "128Mi"
    cpu: "500m"

deploymentMode: deployment

# Optional nodeSelector & tolerations
nodeSelector: {}
tolerations: []

ingress:
  enabled: false
  host: nextgen.hiro-develop.nl

## Update this according to the desired node
nodeSelector:
  role: marketplace

## To control the metics on development
metrics:
  enabled: false
